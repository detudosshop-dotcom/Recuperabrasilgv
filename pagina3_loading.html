      font-weight: 700;
      text-align: center;
      padding: 0 20px;

<body>

  <div class="card">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Encontrando dados do recebedor...</div>
  </div>

  <script>
    const texts = [
      "Encontrando dados do recebedor...",
      "Encontrando instituição...",
      "Instituição encontrada",
      "Transferência sendo enviada..."
    ];

    let currentIndex = 0;
    const textElement = document.getElementById('loadingText');

    const interval = setInterval(() => {
      currentIndex++;
      if (currentIndex < texts.length) {
        textElement.style.opacity = '0';
        setTimeout(() => {
          textElement.textContent = texts[currentIndex];
          textElement.style.opacity = '1';
        }, 300);
      } else {
        clearInterval(interval);
        setTimeout(() => {
          window.location.href = 'pagina3.html' + window.location.search;
        }, 1500); // Aguarda um pouco antes de redirecionar no último texto
      }
    }, 2000);
  </script>

  <script>
    // ─── REPASSADOR DE UTMs (ttclid, utm_source, etc.) ──────────────
    (function() {
      var urlParams = window.location.search;
      if (!urlParams) return;
      function appendParamsToLinks() {
        var links = document.getElementsByTagName('a');
        for (var i = 0; i < links.length; i++) {
          var href = links[i].getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:')) continue;
          var sep = href.indexOf('?') !== -1 ? '&' : '?';
          var params = urlParams.startsWith('?') ? urlParams.slice(1) : urlParams;
          links[i].setAttribute('href', href + sep + params);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', appendParamsToLinks);
      } else {
        appendParamsToLinks();
      }
    })();
    // ────────────────────────────────────────────────────────────────
  </script>
</body>
