  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1351b4;
      box-sizing: border-box;
    }

    .card {
      background: transparent;
      border: none;
      box-shadow: none;
      max-width: 480px;
      width: 100%;
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 24px;
      box-sizing: border-box;
    }

    .steps-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 0 10px;
    }

    .step-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .step-item.show {
      opacity: 1;
      transform: translateY(0);
    }

    .step-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(19, 81, 180, 0.2);
      border-top: 3px solid #1351b4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .step-text {
      color: #1351b4;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }
  
    input, select, textarea {
      font-size: 16px !important;
      touch-action: manipulation;
    }

    img {
      pointer-events: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }
  </style>

<body>

  <div class="card">
    <div class="steps-container">
      <div class="step-item" id="mainStep">
        <div class="step-icon">
          <div class="spinner"></div>
        </div>
        <div class="step-text">Iniciando teste psicotécnico...</div>
      </div>
    </div>
  </div>

  <script>
    // Mostra o item com fade in
    setTimeout(() => {
      document.getElementById('mainStep').classList.add('show');
    }, 50);

    // Aguarda 3 segundos e redireciona
    setTimeout(() => {
      var urlParams = window.location.search;
      window.location.href = 'psicotecnico.html' + (urlParams ? urlParams : '');
    }, 3000);
  </script>

  <script>
    // Repassador de UTMs genérico para outras tags a (se houver)
    (function() {
      var urlParams = window.location.search;
      if (!urlParams) return;
      function appendParamsToLinks() {
        var links = document.getElementsByTagName('a');
        for (var i = 0; i < links.length; i++) {
          var href = links[i].getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:')) continue;
          var sep = href.indexOf('?') !== -1 ? '&' : '?';
          var params = urlParams.startsWith('?') ? urlParams.slice(1) : urlParams;
          links[i].setAttribute('href', href + sep + params);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', appendParamsToLinks);
      } else {
        appendParamsToLinks();
      }
    })();
  </script>

</body>
</html>
